name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Compile scripts
        run: |
          python -m compileall scripts

      - name: Run deterministic validation
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))
          from us_market_data import normalize_us_symbol, choose_authoritative_source, ProviderResult

          symbol = normalize_us_symbol("brk-b")
          assert symbol.canonical == "BRK.B"
          assert symbol.yfinance == "BRK-B"

          source, downgraded, reason = choose_authoritative_source(
              {
                  "schwab": ProviderResult("schwab", "AAPL", "AAPL", True, [{"date": "20260410", "open": 1, "high": 1, "low": 1, "close": 1, "volume": 1}]),
                  "alpaca": ProviderResult("alpaca", "AAPL", "AAPL", True, [{"date": "20260410", "open": 1, "high": 1, "low": 1, "close": 1, "volume": 1}]),
              }
          )
          assert source == "schwab"
          assert downgraded is False
          assert reason is None

          with tempfile.TemporaryDirectory() as temp_dir:
              state_file = Path(temp_dir) / "portfolio_state_us.json"
              subprocess.run(
                  [
                      sys.executable,
                      "scripts/portfolio_state_us.py",
                      "--state-file",
                      str(state_file),
                      "init",
                      "--cash",
                      "10000",
                      "--as-of-date",
                      "20260410",
                      "--overwrite",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              subprocess.run(
                  [
                      sys.executable,
                      "scripts/portfolio_state_us.py",
                      "--state-file",
                      str(state_file),
                      "buy",
                      "AAPL",
                      "--price",
                      "200",
                      "--budget",
                      "1000",
                      "--date",
                      "20260410",
                      "--name",
                      "Apple Inc",
                      "--estimated",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              proc = subprocess.run(
                  [
                      sys.executable,
                      "scripts/portfolio_state_us.py",
                      "--state-file",
                      str(state_file),
                      "show",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              payload = json.loads(proc.stdout)
              assert payload["cash_available"] == 9000.0
              assert payload["positions"][0]["symbol"] == "AAPL"
              assert payload["positions"][0]["shares"] == 5
          PY

      - name: Run smoke test (deterministic)
        run: |
          python scripts/smoke_test.py
