<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">My Codex Skills Banner</title>
  <desc id="desc">Hero banner for My Codex Skills repository</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="45%" stop-color="#13233f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#35f5c8" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="glowB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1600" height="520" fill="url(#bg)"/>
  <circle cx="190" cy="120" r="150" fill="url(#glowB)" filter="url(#blur)"/>
  <circle cx="1410" cy="420" r="180" fill="url(#glowB)" filter="url(#blur)"/>

  <g opacity="0.24" stroke="#5eead4" stroke-width="2">
    <path d="M0 120h1600"/>
    <path d="M0 210h1600"/>
    <path d="M0 300h1600"/>
    <path d="M0 390h1600"/>
    <path d="M220 0v520"/>
    <path d="M510 0v520"/>
    <path d="M800 0v520"/>
    <path d="M1090 0v520"/>
    <path d="M1380 0v520"/>
  </g>

  <g transform="translate(150 120)">
    <rect x="0" y="0" width="180" height="180" rx="26" fill="#0f1a30" stroke="url(#glowA)" stroke-width="4"/>
    <path d="M45 92h90" stroke="#7dd3fc" stroke-width="10" stroke-linecap="round"/>
    <path d="M90 47v90" stroke="#35f5c8" stroke-width="10" stroke-linecap="round"/>
    <circle cx="90" cy="90" r="58" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.75"/>
  </g>

  <text x="390" y="198" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="700" font-size="76">
    My Codex Skills
  </text>
  <text x="392" y="258" fill="#67e8f9" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="600" font-size="34">
    Build, version, and deploy your personal skill library
  </text>

  <g transform="translate(392 304)">
    <rect x="0" y="0" width="250" height="52" rx="26" fill="#0b1220" stroke="#22d3ee"/>
    <text x="25" y="34" fill="#a5f3fc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="600">Codex-ready</text>

    <rect x="270" y="0" width="340" height="52" rx="26" fill="#0b1220" stroke="#35f5c8"/>
    <text x="295" y="34" fill="#bbf7d0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="600">Safe local workflow</text>

    <rect x="630" y="0" width="320" height="52" rx="26" fill="#0b1220" stroke="#7dd3fc"/>
    <text x="655" y="34" fill="#bfdbfe" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="600">Personal + curated</text>
  </g>
</svg>
